name: daily data fetch

# Manual backup only (the Mac's launchd job is the scheduler). Pulls the day's
# bars from Angel One and commits them. Run with: gh workflow run fetch.yml
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHON: python

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-fetch.txt
      - run: pip install -q -r requirements.txt -r requirements-fetch.txt
      - name: credentials
        run: |
          umask 077
          printf 'ANGEL_API_KEY=%s\nANGEL_CLIENT_CODE=%s\nANGEL_MPIN=%s\nANGEL_TOTP_SECRET=%s\n' \
            "${{ secrets.ANGEL_API_KEY }}" "${{ secrets.ANGEL_CLIENT_CODE }}" "${{ secrets.ANGEL_MPIN }}" \
            "${{ secrets.ANGEL_TOTP_SECRET }}" > .env
      - name: fetch + validate + commit
        run: |
          git config user.name "nifty180-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/scheduled_fetch.sh
          echo "--- scheduled_fetch.log ---"; tail -n 25 data/raw/scheduled_fetch.log
      # the commit/push is done inside scheduled_fetch.sh (same code path as the Mac job)
