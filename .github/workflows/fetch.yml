name: daily data fetch

# 13:00 UTC = 18:30 IST, weekdays. Pulls the day's bars from Angel One into
# data/raw/angel/ and commits them, so per-contract history accumulates in
# the repo (Angel One drops a contract from its API the day after expiry).
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHON: python

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-fetch.txt
      - run: pip install -q -r requirements.txt -r requirements-fetch.txt
      - name: credentials
        run: |
          umask 077
          printf 'ANGEL_API_KEY=%s\nANGEL_CLIENT_CODE=%s\nANGEL_MPIN=%s\nANGEL_TOTP_SECRET=%s\n' \
            "${{ secrets.ANGEL_API_KEY }}" "${{ secrets.ANGEL_CLIENT_CODE }}" "${{ secrets.ANGEL_MPIN }}" \
            "${{ secrets.ANGEL_TOTP_SECRET }}" > .env
      - name: fetch + validate
        run: |
          bash scripts/scheduled_fetch.sh
          echo "--- scheduled_fetch.log ---"; tail -n 25 data/raw/scheduled_fetch.log
      - name: commit the bar cache
        run: |
          git config user.name "nifty180-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/angel
          git diff --cached --quiet && echo "no new bars" && exit 0
          git commit -q -m "data: bars through $(date +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
